##############################################################################
#  docker-compose.yml — Kafka Cluster + Spark + MinIO + PostgreSQL
#  M1 · Data & Kafka  +  M2 · Spark Streaming  +  M3 · SparkSQL Analytics
#  Real-Time US Stocks Data Pipeline
#
#  MinIO acts as an S3-compatible object store for Parquet data.
#  PostgreSQL stores SparkSQL analytics output (analytics_job.py).
#
#  NOTE (2026-09-12): minio/minio and minio/mc were pulled from Docker Hub
#  after MinIO stopped publishing free community-edition images. The minio
#  service now uses elestio/minio (Docker Hub Verified Publisher, tracks
#  upstream releases) and minio-init uses a pinned minio/mc tag that was
#  pushed before the cutoff and is still pullable.
#
#  MinIO console  : http://localhost:9001   (minioadmin / minioadmin)
#  MinIO API      : http://localhost:9000
#  Spark Master   : http://localhost:8081
#  Kafka UI       : http://localhost:8080
#  PostgreSQL     : localhost:5432  (stocks / stocks123)
##############################################################################

services:

  # ── Kafka Broker+Controller 1 ─────────────────────────────────────────────
  kafka-1:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-1
    restart: unless-stopped
    networks:
      - stocks-net
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID:            1
      CLUSTER_ID:               MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_PROCESS_ROLES:      broker,controller
      KAFKA_LISTENERS:                      CONTROLLER://kafka-1:29091,PLAINTEXT://kafka-1:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS:           PLAINTEXT://kafka-1:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME:     PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES:      CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS:       1@kafka-1:29091,2@kafka-2:29091,3@kafka-3:29091
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:            3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR:    3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:               2
      KAFKA_DEFAULT_REPLICATION_FACTOR:                  3
      KAFKA_MIN_INSYNC_REPLICAS:                         2
      KAFKA_NUM_PARTITIONS:                              6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:                   "false"
      KAFKA_DELETE_TOPIC_ENABLE:                         "true"
      KAFKA_LOG_RETENTION_HOURS:                         168
      KAFKA_LOG_SEGMENT_BYTES:                           1073741824
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS:            100
      KAFKA_COMPRESSION_TYPE:                            lz4
      KAFKA_LOG_DIRS:                                    /var/lib/kafka/data
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka-1:29092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Kafka Broker+Controller 2 ─────────────────────────────────────────────
  kafka-2:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-2
    restart: unless-stopped
    networks:
      - stocks-net
    ports:
      - "9093:9093"
    environment:
      KAFKA_NODE_ID:            2
      CLUSTER_ID:               MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_PROCESS_ROLES:      broker,controller
      KAFKA_LISTENERS:                      CONTROLLER://kafka-2:29091,PLAINTEXT://kafka-2:29093,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS:           PLAINTEXT://kafka-2:29093,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME:     PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES:      CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS:       1@kafka-1:29091,2@kafka-2:29091,3@kafka-3:29091
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:            3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR:    3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:               2
      KAFKA_DEFAULT_REPLICATION_FACTOR:                  3
      KAFKA_MIN_INSYNC_REPLICAS:                         2
      KAFKA_NUM_PARTITIONS:                              6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:                   "false"
      KAFKA_DELETE_TOPIC_ENABLE:                         "true"
      KAFKA_LOG_RETENTION_HOURS:                         168
      KAFKA_LOG_SEGMENT_BYTES:                           1073741824
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS:            100
      KAFKA_COMPRESSION_TYPE:                            lz4
      KAFKA_LOG_DIRS:                                    /var/lib/kafka/data
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka-2:29093"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Kafka Broker+Controller 3 ─────────────────────────────────────────────
  kafka-3:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-3
    restart: unless-stopped
    networks:
      - stocks-net
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID:            3
      CLUSTER_ID:               MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_PROCESS_ROLES:      broker,controller
      KAFKA_LISTENERS:                      CONTROLLER://kafka-3:29091,PLAINTEXT://kafka-3:29094,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS:           PLAINTEXT://kafka-3:29094,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME:     PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES:      CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS:       1@kafka-1:29091,2@kafka-2:29091,3@kafka-3:29091
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:            3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR:    3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:               2
      KAFKA_DEFAULT_REPLICATION_FACTOR:                  3
      KAFKA_MIN_INSYNC_REPLICAS:                         2
      KAFKA_NUM_PARTITIONS:                              6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:                   "false"
      KAFKA_DELETE_TOPIC_ENABLE:                         "true"
      KAFKA_LOG_RETENTION_HOURS:                         168
      KAFKA_LOG_SEGMENT_BYTES:                           1073741824
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS:            100
      KAFKA_COMPRESSION_TYPE:                            lz4
      KAFKA_LOG_DIRS:                                    /var/lib/kafka/data
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka-3:29094"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Topic initialiser (runs once, then exits) ──────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-init
    networks:
      - stocks-net
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        echo '--------------------------------------------------'
        echo '  Waiting 30 s for KRaft leader election ...'
        echo '--------------------------------------------------'
        sleep 30

        echo '  Creating topic: us-stocks-raw'
        kafka-topics --bootstrap-server kafka-1:29092 --create --if-not-exists \
          --topic us-stocks-raw --partitions 6 --replication-factor 3 \
          --config retention.ms=604800000 \
          --config compression.type=lz4 \
          --config min.insync.replicas=2

        echo '  Creating topic: us-stocks-dead-letter'
        kafka-topics --bootstrap-server kafka-1:29092 --create --if-not-exists \
          --topic us-stocks-dead-letter --partitions 3 --replication-factor 3 \
          --config retention.ms=2592000000 \
          --config compression.type=lz4

        echo ''
        echo '  All topics:'
        kafka-topics --bootstrap-server kafka-1:29092 --list

        echo ''
        echo '  Details - us-stocks-raw:'
        kafka-topics --bootstrap-server kafka-1:29092 --describe --topic us-stocks-raw

        echo '--------------------------------------------------'
        echo '  Topics ready. Done.'
        echo '--------------------------------------------------'
    restart: "no"

  # ── MinIO — S3-compatible object store (replaces HDFS) ────────────────────
  # minio/minio was pulled from Docker Hub (MinIO stopped publishing free
  # community images). elestio/minio is a Docker Hub Verified Publisher
  # image that stays in sync with upstream MinIO releases.
  minio:
    image: elestio/minio:latest
    container_name: stocks-minio
    restart: unless-stopped
    networks:
      - stocks-net
    ports:
      - "9000:9000"    # S3 API  — used by Spark S3A connector
      - "9001:9001"    # Web console — http://localhost:9001
    environment:
      MINIO_ROOT_USER:     ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server --address ":9000" --console-address ":9001" /data
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── MinIO bucket initialiser (runs once, then exits) ──────────────────────
  # Every mc container image we tried has turned out unreliable
  # (minio/mc removed from Docker Hub; cgr.dev/chainguard/mc needs an org
  # context; the Docker Hub mirror's -dev tag availability is unconfirmed).
  # Instead of chasing another registry, this downloads the mc BINARY
  # directly from dl.min.io — MinIO's own CDN, separate from their Docker
  # Hub distribution, and still serving binaries as of April 2026 — inside
  # a plain alpine image, which is one of the most stable images on Docker Hub.
  minio-init:
    image: elestio/minio:latest
    container_name: stocks-minio-init
    networks:
      - stocks-net
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e

        echo "Setting MinIO alias..."
        mc alias set local http://minio:9000 \
          "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}"

        echo "Creating stocks bucket..."
        mc mb --ignore-existing local/stocks

        echo 'Bucket "stocks" is ready.'
    restart: "no"

  # ── PostgreSQL — analytics output store ───────────────────────────────────
  postgres:
    image: postgres:16
    container_name: stocks-postgres
    restart: unless-stopped
    networks:
      - stocks-net
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-stocks_analytics}
      POSTGRES_USER:     ${POSTGRES_USER:-stocks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stocks123}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # init_postgres.sql runs once on first container boot
      - ./spark/init_postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stocks} -d ${POSTGRES_DB:-stocks_analytics}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Producer (streams Kaggle → Kafka) ─────────────────────────────────────
  producer:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: stocks-producer
    restart: on-failure
    networks:
      - stocks-net
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka-1:29092,kafka-2:29093,kafka-3:29094
      KAFKA_TOPIC:     us-stocks-raw
      KAGGLE_USERNAME: ${KAGGLE_USERNAME}
      KAGGLE_KEY:      ${KAGGLE_KEY}
    command:
      - python
      - producer.py
      - --rows-per-sec
      - "500"
      - --batch-size
      - "250"
      - --stock-list
      - /app/Stock_List.csv
    volumes:
      - ./kafka:/app

  # ── Consumer / validator ───────────────────────────────────────────────────
  consumer:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: stocks-consumer
    restart: on-failure
    networks:
      - stocks-net
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka-1:29092,kafka-2:29093,kafka-3:29094
      KAFKA_TOPIC:     us-stocks-raw
      KAFKA_GROUP_ID:  m1-validation-group
    command:
      - python
      - consumer.py
      - --batch-size
      - "100"
      - --max-wait-ms
      - "5000"
      - --idle-timeout
      - "180"
    volumes:
      - ./kafka:/app

  # ── Kafka UI  (http://localhost:8080) ──────────────────────────────────────
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    networks:
      - stocks-net
    ports:
      - "8080:8080"
    depends_on:
      kafka-1:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME:             us-stocks-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29093,kafka-3:29094
      KAFKA_CLUSTERS_0_AUDIT_TOPICAUDITENABLED: "false"
      DYNAMIC_CONFIG_ENABLED:                   "true"

  # ── Spark Master ───────────────────────────────────────────────────────────
  spark:
    build:
      context: ./spark
      dockerfile: Dockerfile
    image: stocks-spark:3.5.7
    container_name: stocks-spark
    restart: unless-stopped
    networks:
      - stocks-net
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"
      - "8081:8080"   # Spark Master web UI
    environment:
      MINIO_ENDPOINT:   http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET:     ${MINIO_BUCKET:-stocks}
      # PostgreSQL — consumed by analytics_job.py
      POSTGRES_HOST:     postgres
      POSTGRES_PORT:     5432
      POSTGRES_DB:       ${POSTGRES_DB:-stocks_analytics}
      POSTGRES_USER:     ${POSTGRES_USER:-stocks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stocks123}
    volumes:
      - ./spark:/opt/spark/work-dir

  # ── Spark Worker ───────────────────────────────────────────────────────────
  spark-worker:
    image: stocks-spark:3.5.7
    container_name: stocks-spark-worker
    restart: unless-stopped
    networks:
      - stocks-net
    depends_on:
      - spark
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://stocks-spark:7077
    environment:
      MINIO_ENDPOINT:   http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET:     ${MINIO_BUCKET:-stocks}
      SPARK_WORKER_MEMORY: 4g
      SPARK_WORKER_CORES:  4
      # PostgreSQL — consumed by analytics_job.py
      POSTGRES_HOST:     postgres
      POSTGRES_PORT:     5432
      POSTGRES_DB:       ${POSTGRES_DB:-stocks_analytics}
      POSTGRES_USER:     ${POSTGRES_USER:-stocks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stocks123}
    volumes:
      - ./spark:/opt/spark/work-dir

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: stocks-pgadmin
    restart: unless-stopped
    networks:
      - stocks-net
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@stocks.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    depends_on:
      postgres:
        condition: service_healthy
# ── Named volumes ──────────────────────────────────────────────────────────────
volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  minio-data:
  postgres-data:        # persists PostgreSQL data across container restarts

# ── Network ────────────────────────────────────────────────────────────────────
networks:
  stocks-net:
    driver: bridge
    name: stocks-net