##############################################################################
#  docker-compose.yml — OPTIMIZED for maximum throughput
#  Kafka Cluster + Spark + MinIO + PostgreSQL
#  Real-Time US Stocks Data Pipeline
#
#  KEY OPTIMISATIONS vs the original:
#   Producer  : rows-per-sec 500→5000, batch-size 250→1000, queue 5→20
#   Consumer  : batch-size 100→500, max-wait-ms 5000→2000, idle-timeout 180→300
#   Spark     : executor memory 2g→6g, driver memory 2g→4g
#   Spark Worker: memory 4g→8g, cores 4→8
#   PostgreSQL: shared_buffers, work_mem, max_connections tuned
#   MinIO     : MINIO_API_REQUESTS_MAX raised for high-throughput Spark writes
##############################################################################

services:

  # ── Kafka Broker+Controller 1 ─────────────────────────────────────────────
  kafka-1:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-1
    restart: unless-stopped
    networks:
      - stocks-net
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID:            1
      CLUSTER_ID:               MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_PROCESS_ROLES:      broker,controller
      KAFKA_LISTENERS:                      CONTROLLER://kafka-1:29091,PLAINTEXT://kafka-1:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS:           PLAINTEXT://kafka-1:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME:     PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES:      CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS:       1@kafka-1:29091,2@kafka-2:29091,3@kafka-3:29091
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:            3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR:    3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:               2
      KAFKA_DEFAULT_REPLICATION_FACTOR:                  3
      KAFKA_MIN_INSYNC_REPLICAS:                         2
      KAFKA_NUM_PARTITIONS:                              6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:                   "false"
      KAFKA_DELETE_TOPIC_ENABLE:                         "true"
      KAFKA_LOG_RETENTION_HOURS:                         168
      KAFKA_LOG_SEGMENT_BYTES:                           1073741824
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS:            0       # was 100 — faster consumer startup
      KAFKA_COMPRESSION_TYPE:                            lz4
      KAFKA_LOG_DIRS:                                    /var/lib/kafka/data
      # ── Throughput tuning ───────────────────────────────────────────────
      KAFKA_SOCKET_SEND_BUFFER_BYTES:                    1048576   # 1 MB
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES:                 1048576   # 1 MB
      KAFKA_SOCKET_REQUEST_MAX_BYTES:                    104857600 # 100 MB
      KAFKA_LOG_FLUSH_INTERVAL_MESSAGES:                 50000
      KAFKA_LOG_FLUSH_INTERVAL_MS:                       1000
      KAFKA_NUM_NETWORK_THREADS:                         6         # was default 3
      KAFKA_NUM_IO_THREADS:                              8         # was default 8, explicit
      KAFKA_REPLICA_FETCH_MAX_BYTES:                     10485760  # 10 MB
      KAFKA_MESSAGE_MAX_BYTES:                           10485760  # 10 MB
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka-1:29092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Kafka Broker+Controller 2 ─────────────────────────────────────────────
  kafka-2:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-2
    restart: unless-stopped
    networks:
      - stocks-net
    ports:
      - "9093:9093"
    environment:
      KAFKA_NODE_ID:            2
      CLUSTER_ID:               MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_PROCESS_ROLES:      broker,controller
      KAFKA_LISTENERS:                      CONTROLLER://kafka-2:29091,PLAINTEXT://kafka-2:29093,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS:           PLAINTEXT://kafka-2:29093,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME:     PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES:      CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS:       1@kafka-1:29091,2@kafka-2:29091,3@kafka-3:29091
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:            3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR:    3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:               2
      KAFKA_DEFAULT_REPLICATION_FACTOR:                  3
      KAFKA_MIN_INSYNC_REPLICAS:                         2
      KAFKA_NUM_PARTITIONS:                              6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:                   "false"
      KAFKA_DELETE_TOPIC_ENABLE:                         "true"
      KAFKA_LOG_RETENTION_HOURS:                         168
      KAFKA_LOG_SEGMENT_BYTES:                           1073741824
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS:            0
      KAFKA_COMPRESSION_TYPE:                            lz4
      KAFKA_LOG_DIRS:                                    /var/lib/kafka/data
      KAFKA_SOCKET_SEND_BUFFER_BYTES:                    1048576
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES:                 1048576
      KAFKA_SOCKET_REQUEST_MAX_BYTES:                    104857600
      KAFKA_LOG_FLUSH_INTERVAL_MESSAGES:                 50000
      KAFKA_LOG_FLUSH_INTERVAL_MS:                       1000
      KAFKA_NUM_NETWORK_THREADS:                         6
      KAFKA_NUM_IO_THREADS:                              8
      KAFKA_REPLICA_FETCH_MAX_BYTES:                     10485760
      KAFKA_MESSAGE_MAX_BYTES:                           10485760
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka-2:29093"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Kafka Broker+Controller 3 ─────────────────────────────────────────────
  kafka-3:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-3
    restart: unless-stopped
    networks:
      - stocks-net
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID:            3
      CLUSTER_ID:               MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_PROCESS_ROLES:      broker,controller
      KAFKA_LISTENERS:                      CONTROLLER://kafka-3:29091,PLAINTEXT://kafka-3:29094,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS:           PLAINTEXT://kafka-3:29094,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME:     PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES:      CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS:       1@kafka-1:29091,2@kafka-2:29091,3@kafka-3:29091
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:            3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR:    3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:               2
      KAFKA_DEFAULT_REPLICATION_FACTOR:                  3
      KAFKA_MIN_INSYNC_REPLICAS:                         2
      KAFKA_NUM_PARTITIONS:                              6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:                   "false"
      KAFKA_DELETE_TOPIC_ENABLE:                         "true"
      KAFKA_LOG_RETENTION_HOURS:                         168
      KAFKA_LOG_SEGMENT_BYTES:                           1073741824
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS:            0
      KAFKA_COMPRESSION_TYPE:                            lz4
      KAFKA_LOG_DIRS:                                    /var/lib/kafka/data
      KAFKA_SOCKET_SEND_BUFFER_BYTES:                    1048576
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES:                 1048576
      KAFKA_SOCKET_REQUEST_MAX_BYTES:                    104857600
      KAFKA_LOG_FLUSH_INTERVAL_MESSAGES:                 50000
      KAFKA_LOG_FLUSH_INTERVAL_MS:                       1000
      KAFKA_NUM_NETWORK_THREADS:                         6
      KAFKA_NUM_IO_THREADS:                              8
      KAFKA_REPLICA_FETCH_MAX_BYTES:                     10485760
      KAFKA_MESSAGE_MAX_BYTES:                           10485760
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka-3:29094"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Topic initialiser ─────────────────────────────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-init
    networks:
      - stocks-net
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        echo '--------------------------------------------------'
        echo '  Waiting 30 s for KRaft leader election ...'
        echo '--------------------------------------------------'
        sleep 30

        echo '  Creating topic: us-stocks-raw'
        kafka-topics --bootstrap-server kafka-1:29092 --create --if-not-exists \
          --topic us-stocks-raw --partitions 6 --replication-factor 3 \
          --config retention.ms=604800000 \
          --config compression.type=lz4 \
          --config min.insync.replicas=2 \
          --config max.message.bytes=10485760

        echo '  Creating topic: us-stocks-dead-letter'
        kafka-topics --bootstrap-server kafka-1:29092 --create --if-not-exists \
          --topic us-stocks-dead-letter --partitions 3 --replication-factor 3 \
          --config retention.ms=2592000000 \
          --config compression.type=lz4

        echo ''
        echo '  All topics:'
        kafka-topics --bootstrap-server kafka-1:29092 --list

        echo '--------------------------------------------------'
        echo '  Topics ready. Done.'
        echo '--------------------------------------------------'
    restart: "no"

  # ── MinIO ─────────────────────────────────────────────────────────────────
  minio:
    image: elestio/minio:latest
    container_name: stocks-minio
    restart: unless-stopped
    networks:
      - stocks-net
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER:              ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD:          ${MINIO_SECRET_KEY:-minioadmin}
      # ── Throughput tuning ─────────────────────────────────────────────────
      MINIO_API_REQUESTS_MAX:       600      # allow more concurrent S3 ops
      MINIO_API_REQUESTS_DEADLINE:  10m
    command: server --address ":9000" --console-address ":9001" /data
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── MinIO bucket initialiser ──────────────────────────────────────────────
  minio-init:
    image: elestio/minio:latest
    container_name: stocks-minio-init
    networks:
      - stocks-net
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Setting MinIO alias..."
        mc alias set local http://minio:9000 \
          "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}"
        echo "Creating stocks bucket..."
        mc mb --ignore-existing local/stocks
        echo 'Bucket "stocks" is ready.'
    restart: "no"

  # ── PostgreSQL — tuned for bulk JDBC writes ───────────────────────────────
  postgres:
    image: postgres:16
    container_name: stocks-postgres
    restart: unless-stopped
    networks:
      - stocks-net
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-stocks_analytics}
      POSTGRES_USER:     ${POSTGRES_USER:-stocks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stocks123}
    # Pass performance parameters directly — no need for a custom postgresql.conf
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - max_connections=200
      - -c
      - synchronous_commit=off         # safe speed-up for analytics bulk load
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_buffers=64MB
      - -c
      - max_wal_size=2GB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./spark/init_postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stocks} -d ${POSTGRES_DB:-stocks_analytics}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Producer — OPTIMISED ──────────────────────────────────────────────────
  # rows-per-sec : 500  → 5 000   (10× faster ingestion)
  # batch-size   : 250  → 1 000   (fewer round-trips to Kafka)
  producer:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: stocks-producer
    restart: on-failure
    networks:
      - stocks-net
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka-1:29092,kafka-2:29093,kafka-3:29094
      KAFKA_TOPIC:     us-stocks-raw
      KAGGLE_USERNAME: ${KAGGLE_USERNAME}
      KAGGLE_KEY:      ${KAGGLE_KEY}
    command:
      - python
      - producer.py
      - --rows-per-sec
      - "5000"          # was 500
      - --batch-size
      - "1000"          # was 250
      - --stock-list
      - /app/Stock_List.csv
    volumes:
      - ./kafka:/app

  # ── Consumer / validator — OPTIMISED ─────────────────────────────────────
  # batch-size   : 100  → 500     (larger batches, fewer commits)
  # max-wait-ms  : 5000 → 2000    (flush more frequently)
  # idle-timeout : 180  → 300     (more patient waiting for slow producers)
  consumer:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: stocks-consumer
    restart: on-failure
    networks:
      - stocks-net
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka-1:29092,kafka-2:29093,kafka-3:29094
      KAFKA_TOPIC:     us-stocks-raw
      KAFKA_GROUP_ID:  m1-validation-group
    command:
      - python
      - consumer.py
      - --batch-size
      - "500"           # was 100
      - --max-wait-ms
      - "2000"          # was 5000
      - --idle-timeout
      - "300"           # was 180
    volumes:
      - ./kafka:/app

  # ── Kafka UI ──────────────────────────────────────────────────────────────
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    networks:
      - stocks-net
    ports:
      - "8080:8080"
    depends_on:
      kafka-1:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME:             us-stocks-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29093,kafka-3:29094
      KAFKA_CLUSTERS_0_AUDIT_TOPICAUDITENABLED: "false"
      DYNAMIC_CONFIG_ENABLED:                   "true"

  # ── Spark Master — OPTIMISED ─────────────────────────────────────────────
  spark:
    build:
      context: ./spark
      dockerfile: Dockerfile
    image: stocks-spark:3.5.7
    container_name: stocks-spark
    restart: unless-stopped
    networks:
      - stocks-net
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"
      - "8081:8080"
    environment:
      MINIO_ENDPOINT:   http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET:     ${MINIO_BUCKET:-stocks}
      POSTGRES_HOST:     postgres
      POSTGRES_PORT:     5432
      POSTGRES_DB:       ${POSTGRES_DB:-stocks_analytics}
      POSTGRES_USER:     ${POSTGRES_USER:-stocks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stocks123}
      # ── JVM heap for the master process ───────────────────────────────────
      SPARK_MASTER_OPTS: "-Xms512m -Xmx1g"
    volumes:
      - ./spark:/opt/spark/work-dir

  # ── Spark Worker — OPTIMISED ─────────────────────────────────────────────
  # memory : 4g → 8g   (fits larger micro-batches without spill)
  # cores  : 4  → 8    (more parallelism for analytics queries)
  spark-worker:
    image: stocks-spark:3.5.7
    container_name: stocks-spark-worker
    restart: unless-stopped
    networks:
      - stocks-net
    depends_on:
      - spark
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://stocks-spark:7077
    environment:
      MINIO_ENDPOINT:      http://minio:9000
      MINIO_ACCESS_KEY:    ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY:    ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET:        ${MINIO_BUCKET:-stocks}
      SPARK_WORKER_MEMORY: 8g        # was 4g
      SPARK_WORKER_CORES:  8         # was 4
      POSTGRES_HOST:       postgres
      POSTGRES_PORT:       5432
      POSTGRES_DB:         ${POSTGRES_DB:-stocks_analytics}
      POSTGRES_USER:       ${POSTGRES_USER:-stocks}
      POSTGRES_PASSWORD:   ${POSTGRES_PASSWORD:-stocks123}
    volumes:
      - ./spark:/opt/spark/work-dir

  # ── pgAdmin ───────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: stocks-pgadmin
    restart: unless-stopped
    networks:
      - stocks-net
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@stocks.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    depends_on:
      postgres:
        condition: service_healthy

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  minio-data:
  postgres-data:

# ── Network ───────────────────────────────────────────────────────────────────
networks:
  stocks-net:
    driver: bridge
    name: stocks-net