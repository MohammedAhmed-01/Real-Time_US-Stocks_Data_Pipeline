##############################################################################
#  docker-compose.yml — Kafka Cluster (KRaft mode — NO ZooKeeper)
#  M1 · Data & Kafka  |  Real-Time US Stocks Data Pipeline
##############################################################################

services:

  # ── Kafka Broker+Controller 1 ─────────────────────────────────────────────
  kafka-1:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-1
    restart: unless-stopped
    networks:
      - stocks-net
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID:            1
      CLUSTER_ID:               MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_PROCESS_ROLES:      broker,controller
      KAFKA_LISTENERS:                      CONTROLLER://kafka-1:29091,PLAINTEXT://kafka-1:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS:           PLAINTEXT://kafka-1:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME:     PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES:      CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS:       1@kafka-1:29091,2@kafka-2:29091,3@kafka-3:29091
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:            3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR:    3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:               2
      KAFKA_DEFAULT_REPLICATION_FACTOR:                  3
      KAFKA_MIN_INSYNC_REPLICAS:                         2
      KAFKA_NUM_PARTITIONS:                              6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:                   "false"
      KAFKA_DELETE_TOPIC_ENABLE:                         "true"
      KAFKA_LOG_RETENTION_HOURS:                         168
      KAFKA_LOG_SEGMENT_BYTES:                           1073741824
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS:            100
      KAFKA_COMPRESSION_TYPE:                            lz4
      KAFKA_LOG_DIRS:                                    /var/lib/kafka/data
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka-1:29092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Kafka Broker+Controller 2 ─────────────────────────────────────────────
  kafka-2:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-2
    restart: unless-stopped
    networks:
      - stocks-net
    ports:
      - "9093:9093"
    environment:
      KAFKA_NODE_ID:            2
      CLUSTER_ID:               MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_PROCESS_ROLES:      broker,controller
      KAFKA_LISTENERS:                      CONTROLLER://kafka-2:29091,PLAINTEXT://kafka-2:29093,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS:           PLAINTEXT://kafka-2:29093,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME:     PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES:      CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS:       1@kafka-1:29091,2@kafka-2:29091,3@kafka-3:29091
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:            3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR:    3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:               2
      KAFKA_DEFAULT_REPLICATION_FACTOR:                  3
      KAFKA_MIN_INSYNC_REPLICAS:                         2
      KAFKA_NUM_PARTITIONS:                              6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:                   "false"
      KAFKA_DELETE_TOPIC_ENABLE:                         "true"
      KAFKA_LOG_RETENTION_HOURS:                         168
      KAFKA_LOG_SEGMENT_BYTES:                           1073741824
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS:            100
      KAFKA_COMPRESSION_TYPE:                            lz4
      KAFKA_LOG_DIRS:                                    /var/lib/kafka/data
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka-2:29093"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Kafka Broker+Controller 3 ─────────────────────────────────────────────
  kafka-3:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-3
    restart: unless-stopped
    networks:
      - stocks-net
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID:            3
      CLUSTER_ID:               MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_PROCESS_ROLES:      broker,controller
      KAFKA_LISTENERS:                      CONTROLLER://kafka-3:29091,PLAINTEXT://kafka-3:29094,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS:           PLAINTEXT://kafka-3:29094,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME:     PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES:      CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS:       1@kafka-1:29091,2@kafka-2:29091,3@kafka-3:29091
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:            3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR:    3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:               2
      KAFKA_DEFAULT_REPLICATION_FACTOR:                  3
      KAFKA_MIN_INSYNC_REPLICAS:                         2
      KAFKA_NUM_PARTITIONS:                              6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:                   "false"
      KAFKA_DELETE_TOPIC_ENABLE:                         "true"
      KAFKA_LOG_RETENTION_HOURS:                         168
      KAFKA_LOG_SEGMENT_BYTES:                           1073741824
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS:            100
      KAFKA_COMPRESSION_TYPE:                            lz4
      KAFKA_LOG_DIRS:                                    /var/lib/kafka/data
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka-3:29094"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Topic initialiser (runs once, then exits) ──────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-init
    networks:
      - stocks-net
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        echo '--------------------------------------------------'
        echo '  Waiting 30 s for KRaft leader election ...'
        echo '--------------------------------------------------'
        sleep 30

        echo '  Creating topic: us-stocks-raw'
        kafka-topics --bootstrap-server kafka-1:29092 --create --if-not-exists --topic us-stocks-raw --partitions 6 --replication-factor 3 --config retention.ms=604800000 --config compression.type=lz4 --config min.insync.replicas=2

        echo '  Creating topic: us-stocks-dead-letter'
        kafka-topics --bootstrap-server kafka-1:29092 --create --if-not-exists --topic us-stocks-dead-letter --partitions 3 --replication-factor 3 --config retention.ms=2592000000 --config compression.type=lz4

        echo ''
        echo '  All topics:'
        kafka-topics --bootstrap-server kafka-1:29092 --list

        echo ''
        echo '  Details - us-stocks-raw:'
        kafka-topics --bootstrap-server kafka-1:29092 --describe --topic us-stocks-raw

        echo '--------------------------------------------------'
        echo '  Topics ready. Done.'
        echo '--------------------------------------------------'
    restart: "no"

  # ── Producer (streams Kaggle → Kafka at 1 row/sec steady pace) ────────────
  producer:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: stocks-producer
    restart: "no"                        # never auto-restart — it runs to completion
    networks:
      - stocks-net
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP:   kafka-1:29092,kafka-2:29093,kafka-3:29094
      KAFKA_TOPIC:       us-stocks-raw
      KAGGLE_USERNAME:   ${KAGGLE_USERNAME}
      KAGGLE_KEY:        ${KAGGLE_KEY}
    # --rows-per-sec 1   → 1 row every second (steady, visible in Kafka UI)
    # --rows-per-sec 10  → 10 rows/s if you want it faster
    # --rows-per-sec 100 → 100 rows/s for bulk loading
    command: ["python", "producer.py", "--rows-per-sec", "500", "--batch-size", "250"]
    volumes:
      - ./kafka:/app

  # ── Consumer / validator (runs until ALL data is consumed) ─────────────────
  consumer:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: stocks-consumer
    restart: on-failure                  # restart only on crash, not on clean exit
    networks:
      - stocks-net
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP:   kafka-1:29092,kafka-2:29093,kafka-3:29094
      KAFKA_TOPIC:       us-stocks-raw
      KAFKA_GROUP_ID:    m1-validation-group
    # --idle-timeout 180  → waits 3 minutes of silence across ALL partitions
    #                       before declaring all data consumed and exiting.
    #                       Increase this if the producer has long gaps between files.
    command: ["python", "consumer.py", "--batch-size", "100", "--max-wait-ms", "5000", "--idle-timeout", "180"]
    volumes:
      - ./kafka:/app

  # ── Kafka UI  (http://localhost:8080) ──────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    networks:
      - stocks-net
    ports:
      - "8080:8080"
    depends_on:
      kafka-1:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME:             us-stocks-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29093,kafka-3:29094
      # Show message content decoded as JSON in the UI
      KAFKA_CLUSTERS_0_AUDIT_TOPICAUDITENABLED:  "false"
      DYNAMIC_CONFIG_ENABLED:                    "true"

# ── Volumes ────────────────────────────────────────────────────────────────────
volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:

# ── Network ────────────────────────────────────────────────────────────────────
networks:
  stocks-net:
    driver: bridge
    name: stocks-net